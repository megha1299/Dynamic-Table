<div class="p-6 max-w-4xl mx-auto">
  <button 
    (click)="goBack()"
    class="mb-6 flex items-center text-blue-600 hover:text-blue-800 transition-colors"
  >
    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
    </svg>
    Back to Users
  </button>

  <!-- User Details -->
  @if (user) {
    <div class="bg-white rounded-lg shadow-sm border">
      <!-- Header -->
      <div class="bg-gray-50 px-6 py-4 border-b">
        <h1 class="text-2xl font-bold text-gray-900">{{ user.name }}</h1>
      </div>

      <!-- Details -->
      <div class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Basic Information -->
          <div class="space-y-4">
            <h2 class="text-lg font-semibold text-gray-900 border-b pb-2">Basic Information</h2>
            
            <div>
              <label class="block text-sm font-medium text-gray-700">ID</label>
              <p class="mt-1 text-sm text-gray-900 font-mono">{{ user.id }}</p>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Name</label>
              <p class="mt-1 text-sm text-gray-900">{{ user.name }}</p>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Language</label>
              <p class="mt-1 text-sm text-gray-900">{{ user.language }}</p>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Version</label>
              <p class="mt-1 text-sm text-gray-900">{{ user.version }}</p>
            </div>
          </div>

          <!-- Bio Information -->
          <div class="space-y-4">
            <h2 class="text-lg font-semibold text-gray-900 border-b pb-2">Biography</h2>
            
            <div>
              <p class="mt-1 text-sm text-gray-900 leading-relaxed">{{ user.bio }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
